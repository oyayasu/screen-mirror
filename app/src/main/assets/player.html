<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Espelho — ao vivo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#08080b;color:#f5f5fa;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{display:flex;min-height:100vh;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:22px 14px}
.screen{position:relative;width:100%;max-width:1200px;display:flex;align-items:center;justify-content:center;background:#101016;border-radius:16px;min-height:220px;overflow:hidden}
video{display:block;width:100%;max-height:78vh;background:#101016;object-fit:contain}
.screen:fullscreen,.screen:-webkit-full-screen,.screen:-moz-full-screen,.screen.cinema{position:fixed!important;inset:0!important;top:0!important;left:0!important;width:100vw!important;height:100vh!important;max-width:none!important;min-height:0!important;max-height:none!important;margin:0!important;padding:0!important;border-radius:0!important;background:#000!important;z-index:100000!important}
.screen:fullscreen video,.screen:-webkit-full-screen video,.screen:-moz-full-screen video,.screen.cinema video{width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;object-fit:contain}
.screen.fill video{object-fit:cover!important}
#exitCinema{display:none;position:absolute;z-index:4;right:14px;top:14px;padding:8px 13px;background:rgba(0,0,0,.72);border:1px solid #777;border-radius:9px;font-size:14px;color:#fff}
.screen:fullscreen #exitCinema,.screen:-webkit-full-screen #exitCinema,.screen.cinema #exitCinema{display:block}
body.cinema-active{overflow:hidden!important}

#live{position:absolute;top:14px;left:14px;background:#b23247;border-radius:8px;font-size:12px;font-weight:700;padding:7px 10px;display:none;z-index:1;letter-spacing:.05em}
#status{color:#c1bfcf;text-align:center;max-width:640px;font-size:14px;line-height:1.5;min-height:22px}
.actions{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px}
button{font-family:inherit;cursor:pointer;font-size:15px;border:0;border-radius:13px;padding:13px 21px;min-height:45px;color:#fff;background:#2d2b3c}
button.primary{background:#7772be;color:white;font-weight:600}
button:disabled{opacity:.5;cursor:default}
#details{font-size:12px;color:#8f8d9c;text-align:center;max-width:670px;line-height:1.5}
#direct{font-size:12px;color:#c5c0ff;text-align:center;text-decoration:underline}
@media (max-width:600px){main{padding:10px;gap:12px}.screen{border-radius:10px;min-height:175px}button{font-size:14px}}
</style>
</head>
<body>
<main>
  <div class="screen">
    <span id="live">AO VIVO</span>
    <button id="exitCinema" type="button">Sair da tela cheia</button>
    <video id="video" playsinline webkit-playsinline preload="auto"></video>
  </div>
  <div id="status" role="status" aria-live="polite">Conectando à transmissão…</div>
  <div class="actions">
    <button id="play" class="primary" type="button" disabled>Reproduzir ao vivo</button>
    <button id="fullscreen" class="primary" type="button">Tela cheia</button>
    <button id="fit" type="button">Preencher TV</button>
    <button id="reload" type="button">Reconectar</button>
    <button id="native" type="button">Player alternativo</button>
  </div>
  <div id="details"></div>
  <a id="direct" href="__ROOT__/live.m3u8">Abrir o fluxo diretamente</a>
</main>
<script src="__ROOT__/hls.min.js"></script>
<script src="__ROOT__/player.js"></script>
</body>
</html>
