name: Build APK
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Incluir HLS.js no APK (player totalmente local)
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --connect-timeout 20 --max-time 120 \
            https://cdn.jsdelivr.net/npm/hls.js@1.7.4/dist/hls.min.js \
            -o app/src/main/assets/hls.min.js
          curl -fL --retry 3 --connect-timeout 20 --max-time 120 \
            https://cdn.jsdelivr.net/npm/hls.js@1.7.4/LICENSE \
            -o app/src/main/assets/hls-LICENSE.txt
          test "$(wc -c < app/src/main/assets/hls.min.js)" -gt 100000
          node --check app/src/main/assets/player.js
          node --check app/src/main/assets/hls.min.js
          command -v ffmpeg && command -v ffprobe
      - name: Build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: espelho-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
